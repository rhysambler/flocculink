name: Build and Deploy Bookmarks

on:
  push:
    paths:
      - 'bookmarks.xbel'
      - 'scripts/parse_bookmarks.py'
      - '.github/workflows/sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Bookmark Parser
        env:
          BUILD_VERSION: "v0.1.${{ github.run_number }}"
        run: python scripts/parse_bookmarks.py

      - name: Commit and Push Updated index.html
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff-index --quiet HEAD || git commit -m "auto-build index.html [skip ci]"
          git push
